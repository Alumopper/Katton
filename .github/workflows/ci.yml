name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katton-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, and verify deployment jars
        run: >-
          ./gradlew
          build
          verifyReleaseArtifacts
          verifyLocalMavenPublications
          :common:26.1.2:verifyKattonStartupAgent
          :common:26.2:verifyKattonStartupAgent
          :common:26.1.2:verifyKattonStartupInjection
          :common:26.2:verifyKattonStartupInjection
          :common:26.1.2:verifyKattonDynamicAttachInjection
          :common:26.2:verifyKattonDynamicAttachInjection
          --stacktrace
