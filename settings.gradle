pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // Fabric Loom plugin repository
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://maven.kikugie.dev/releases') }
        maven { url = uri('https://maven.kikugie.dev/snapshots') }
        // Architectury / other modding plugins may be hosted elsewhere; add if needed
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

rootProject.name = 'katton'

// 多模块：common（共享 MC 逻辑）、fabric（Fabric 端）、neoforge（NeoForge 端）、paper（Paper 端）
include ':common', ':fabric', ':neoforge', ':paper'

// 指定模块目录
project(':common').projectDir = file('common')
project(':fabric').projectDir = file('fabric')
project(':neoforge').projectDir = file('neoforge')
project(':paper').projectDir = file('paper')

stonecutter {
    centralScript = 'build.gradle'
    kotlinController = false

    shared {
        versions('26.1.2', '26.2')
        vcsVersion = '26.2'
    }

    create('common')
    create('fabric')
    create('neoforge')
    create('paper')
}

println "Project modules: ${rootProject.name} -> ${rootProject.children*.name}"
