buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-library'
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

def targetMinecraftVersion = stonecutter.current.version
version = rootProject.ext.minecraftMavenVersion(targetMinecraftVersion)
group = project.maven_group
ext.useLeanMavenPublication = true

def commonProject = project(":common:${stonecutter.current.project}")
def commonMainSourceSet = commonProject.sourceSets.main
def platformName = project.parent?.name ?: project.name

base {
    archivesName = platformName
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
}

loom {
    mods {
        "kts4mc" {
            sourceSet sourceSets.main
        }
    }
    accessWidenerPath = project.parent.file("src/main/resources/katton.accesswidener")

    // Keep dedicated-server/client synchronization smokes from sharing the
    // default run directory. The override is opt-in and has no release effect.
    def clientRunDirectory = providers.gradleProperty('kattonClientRunDir').orNull
    if (clientRunDirectory) {
        runs {
            client {
                runDir clientRunDirectory
            }
        }
    }
}

dependencies {
    include(implementation('org.jetbrains.kotlin:kotlin-compiler-embeddable'))
    include(implementation('org.jetbrains.kotlin:kotlin-daemon-embeddable'))
    include(implementation('org.jetbrains.kotlin:kotlin-reflect'))
    include(implementation('org.jetbrains.kotlin:kotlin-script-runtime'))
    include(implementation('org.jetbrains.kotlin:kotlin-scripting-common'))
    include(implementation('org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable'))
    include(implementation('org.jetbrains.kotlin:kotlin-scripting-compiler-impl-embeddable'))
    include(implementation('org.jetbrains.kotlin:kotlin-scripting-jvm'))
    include(implementation('org.jetbrains.kotlin:kotlin-scripting-jvm-host'))
    include(implementation('org.jetbrains.kotlin:kotlin-stdlib'))
    include(implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0"))
    include(implementation("org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.0"))
    include(implementation("net.bytebuddy:byte-buddy:1.17.8"))
    include(implementation("net.bytebuddy:byte-buddy-agent:1.17.8"))
    include(implementation("org.jetbrains:annotations:26.0.2"))

    implementation commonMainSourceSet.output

    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    // 运行时：Fabric Loader / Fabric API
    // 这些通过 loom 配置的依赖声明（minecraft, mappings）将由 loom 处理
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft", project.property('fabric_minecraft_version_range')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(project(':common').file('src/main/resources')) {
        include 'assets/**'
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version,
            "minecraft": inputs.properties.minecraft
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

gradle.projectsEvaluated {
    def kotlinSources = sourceSets.main.extensions.findByName('kotlin')
    if (kotlinSources == null) {
        return
    }

    def javaSourceDirs = sourceSets.main.java.srcDirs.collect { it.canonicalFile } as Set
    kotlinSources.setSrcDirs(kotlinSources.srcDirs.findAll { !javaSourceDirs.contains(it.canonicalFile) })
}

tasks.named('compileKotlin') {
    dependsOn tasks.named('stonecutterGenerate')
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${platformName}-katton-${project.version}.jar"
    destinationDirectory = rootProject.layout.buildDirectory
    from(commonMainSourceSet.output)
    manifest {
        attributes(
            'Premain-Class': 'top.katton.engine.KattonAgent',
            'Agent-Class': 'top.katton.engine.KattonAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(commonMainSourceSet.allSource)
}

tasks.named('javadoc', Javadoc) {
    // Fabric entrypoints and mixins are internal wiring, not published API.
    exclude 'top/katton/KattonFabric.java'
    exclude 'top/katton/KattonClientFabric.java'
    exclude 'top/katton/mixin/**'
}

def mavenJar = tasks.register('mavenJar', Jar) {
    group = 'build'
    description = 'Assembles the plain library jar used for Maven publication.'
    archiveBaseName = platformName
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('maven-libs').get().asFile
    from(sourceSets.main.output)
}

def mavenSourcesJar = tasks.register('mavenSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the plain sources jar used for Maven publication.'
    archiveBaseName = platformName
    archiveVersion = project.version.toString()
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('maven-libs').get().asFile
    from(sourceSets.main.allSource)
}

publishing {
    publications.withType(MavenPublication).configureEach {
        setArtifacts([
            mavenJar.get(),
            mavenSourcesJar.get(),
            tasks.named('javadocJar').get()
        ])
        pom.withXml {
            def root = asNode()
            def dependencySections = root.children().findAll { it instanceof Node && it.name() == 'dependencies' }
            def dependenciesNode

            if (dependencySections.size() > 1) {
                def mergedDependencies = [:]
                dependencySections.each { section ->
                    section.children()
                        .findAll { it instanceof Node && it.name() == 'dependency' }
                        .each { dependency ->
                            def groupId = dependency.get('groupId')?.text()
                            def artifactId = dependency.get('artifactId')?.text()
                            def version = dependency.get('version')?.text()
                            def scope = dependency.get('scope')?.text()
                            def key = "${groupId}:${artifactId}"
                            def existing = mergedDependencies[key]

                            if (existing == null || (existing.scope == 'runtime' && scope == 'compile')) {
                                mergedDependencies[key] = [groupId: groupId, artifactId: artifactId, version: version, scope: scope]
                            }
                        }
                }

                dependencySections.each { root.remove(it) }
                dependenciesNode = root.appendNode('dependencies')
                mergedDependencies.values().each { dependency ->
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', dependency.groupId)
                    dependencyNode.appendNode('artifactId', dependency.artifactId)
                    if (dependency.version) {
                        dependencyNode.appendNode('version', dependency.version)
                    }
                    if (dependency.scope) {
                        dependencyNode.appendNode('scope', dependency.scope)
                    }
                }
            } else {
                dependenciesNode = dependencySections ? dependencySections[0] : root.appendNode('dependencies')
            }

            def commonArtifactId = "${rootProject.findProperty('archives_base_name')}-common"
            def hasCommonDependency = dependenciesNode.children()
                .findAll { it instanceof Node && it.name() == 'dependency' }
                .any { dependency ->
                    dependency.get('groupId')?.text() == project.group.toString() &&
                        dependency.get('artifactId')?.text() == commonArtifactId
                }

            if (!hasCommonDependency) {
                def commonDependency = dependenciesNode.appendNode('dependency')
                commonDependency.appendNode('groupId', project.group.toString())
                commonDependency.appendNode('artifactId', commonArtifactId)
                commonDependency.appendNode('version', project.version.toString())
                commonDependency.appendNode('scope', 'compile')
            }
        }
    }
}

// 资源放置

