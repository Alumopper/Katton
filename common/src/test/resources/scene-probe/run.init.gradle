// Opt-in isolated launch; no changes to the project's normal run directories.
// Pass scenePlatform, sceneVersion, sceneRole, sceneDirectory; optionally scenePort/sceneWorld.
gradle.projectsEvaluated {
    def props = gradle.startParameter.projectProperties
    def platform = props.get('scenePlatform') ?: 'fabric'
    def version = props.get('sceneVersion') ?: '26.2'
    def role = props.get('sceneRole') ?: 'client'
    def directory = props.get('sceneDirectory')
    def port = props.get('scenePort') ?: '25585'
    def world = props.get('sceneWorld')
    def quickPlay = world ? ['--quickPlaySingleplayer', world] : ['--quickPlayMultiplayer', "127.0.0.1:${port}"]
    def p = gradle.rootProject.findProject(":${platform}:${version}")
    if (p == null) return // Init scripts also run for buildSrc.
    if (!directory) throw new GradleException('Set sceneDirectory to an isolated game directory')
    if (platform == 'fabric') {
        p.loom.runs.named(role).configure {
            // Loom expects a relative path, including on Windows.
            runDir(p.projectDir.toPath().relativize(p.file(directory).toPath()).toString())
            if (role == 'client') {
                programArgs(*(quickPlay + ['--width', '960', '--height', '640']))
                if (props.get('sceneUsername')) programArgs '--username', props.get('sceneUsername')
            }
        }
    } else {
        p.tasks.named('downloadAssets').configure {
            def executable = System.getProperty('os.name').startsWith('Windows') ? 'java.exe' : 'java'
            javaExecutable = new File(System.getProperty('java.home'), "bin/${executable}").absolutePath
        }
        p.neoForge.runs.named(role).configure {
            gameDirectory = p.file(directory)
            if (role == 'client') {
                programArguments.addAll(quickPlay + ['--width', '960', '--height', '640'])
                if (props.get('sceneUsername')) programArguments.addAll '--username', props.get('sceneUsername')
            }
        }
    }
}
