apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'maven-publish'
apply plugin: 'net.fabricmc.fabric-loom'

def targetMinecraftVersion = stonecutter.current.version
group = project.maven_group
version = rootProject.ext.minecraftMavenVersion(targetMinecraftVersion)
ext.useLeanMavenPublication = true

def platformName = project.parent?.name ?: project.name

base {
    archivesName = platformName
}

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = project.parent.file("src/main/resources/katton.accesswidener")
}

dependencies {
    compileOnly 'org.jetbrains.kotlin:kotlin-compiler-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-daemon-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-reflect'
    compileOnly 'org.jetbrains.kotlin:kotlin-script-runtime'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-common'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-compiler-impl-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-jvm'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-jvm-host'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.0"
    compileOnly "net.bytebuddy:byte-buddy:1.17.8"
    compileOnly "net.bytebuddy:byte-buddy-agent:1.17.8"
    compileOnly "org.jetbrains:annotations:26.0.2"
    compileOnly "org.ow2.asm:asm:9.9.1"
    compileOnly "org.ow2.asm:asm-commons:9.9.1"

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.3.10'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    // ScriptEngine integration tests execute the same embedded compiler used at runtime.
    testRuntimeOnly 'org.jetbrains.kotlin:kotlin-scripting-jvm-host'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.17.8'
    testRuntimeOnly 'net.bytebuddy:byte-buddy-agent:1.17.8'
    testRuntimeOnly 'org.ow2.asm:asm:9.9.1'
    testRuntimeOnly 'org.ow2.asm:asm-commons:9.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    
    // Fabric API for common module
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Compile the shipped script against each version's real Minecraft and Katton API.
tasks.register('verifySceneExamples', JavaExec) {
    group = 'verification'
    description = 'Compiles the client-scene example pack without executing its entrypoints.'
    dependsOn tasks.named('classes')
    classpath = files(configurations.compileClasspath, sourceSets.main.output)
    mainClass = 'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler'
    def exampleSource = rootProject.file('examples/client-scenes/Scenes.kt')
    def probeSource = project.parent.file('src/test/resources/scene-probe/Probe.kt')
    def serverProbeSource = project.parent.file('src/test/resources/scene-probe/ServerProbe.kt')
    def integrationProbeSource = project.parent.file('src/test/resources/scene-probe/IntegrationProbe.kt')
    def reloadProbeSource = project.parent.file('src/test/resources/scene-probe/reload-pack/ReloadScene.kt')
    def exampleOutput = layout.buildDirectory.dir('scene-example-classes')
    inputs.file(exampleSource)
    inputs.file(probeSource)
    inputs.file(serverProbeSource)
    inputs.file(integrationProbeSource)
    inputs.file(reloadProbeSource)
    inputs.files(classpath)
    outputs.dir(exampleOutput)
    doFirst {
        args = ['-no-stdlib', '-no-reflect', '-jvm-target', '25',
                '-classpath', classpath.asPath, '-d', exampleOutput.get().asFile.absolutePath,
                exampleSource.absolutePath, probeSource.absolutePath, serverProbeSource.absolutePath,
                integrationProbeSource.absolutePath, reloadProbeSource.absolutePath]
    }
}
tasks.named('check') { dependsOn tasks.named('verifySceneExamples') }

def kattonAgentManifest = [
    'Premain-Class': 'top.katton.engine.KattonAgent',
    'Agent-Class': 'top.katton.engine.KattonAgent',
    'Can-Redefine-Classes': 'true',
    'Can-Retransform-Classes': 'true'
]

tasks.named('jar', Jar) {
    manifest.attributes(kattonAgentManifest)
}

def injectionProbeMainClass = 'top.katton.engine.InjectionEnvironmentProbe'
def injectionProbeClasspath = files(
    sourceSets.test.output,
    tasks.named('jar').flatMap { it.archiveFile }
)

tasks.register('probeInjectionEnvironment', JavaExec) {
    group = 'verification'
    description = 'Print the desktop JVM capabilities used by Katton runtime injection.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = injectionProbeClasspath
    mainClass = injectionProbeMainClass
}

tasks.register('probeFclLikeInjectionEnvironment', JavaExec) {
    group = 'verification'
    description = 'Reproduce an FCL-like Java 25 image without the jdk.attach module.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = injectionProbeClasspath
    mainClass = injectionProbeMainClass
    jvmArgs '--limit-modules=java.base,java.instrument,java.management'
    systemProperty 'minecraft.launcher.brand', 'Fold Craft Launcher'
    systemProperty 'os.version', 'Android-simulated'
    systemProperty 'katton.probe.expectFcl', 'true'
    systemProperty 'katton.probe.expectAttach', 'false'
    systemProperty 'katton.probe.expectAgent', 'false'
}

tasks.register('verifyKattonStartupAgent', JavaExec) {
    group = 'verification'
    description = 'Verify Katton can redefine classes via -javaagent when jdk.attach is absent.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = injectionProbeClasspath
    mainClass = injectionProbeMainClass
    jvmArgs '--limit-modules=java.base,java.instrument,java.management'
    systemProperty 'minecraft.launcher.brand', 'Fold Craft Launcher'
    systemProperty 'os.version', 'Android-simulated'
    systemProperty 'katton.probe.expectFcl', 'true'
    systemProperty 'katton.probe.expectAttach', 'false'
    systemProperty 'katton.probe.expectAgent', 'true'
    doFirst {
        def agentJar = tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'katton.probe.agentJar', agentJar
        jvmArgs "-javaagent:${agentJar}"
    }
}

tasks.register('verifyKattonStartupInjection', Test) {
    group = 'verification'
    description = 'Exercise Katton method injection through startup Instrumentation without dynamic Attach.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'top.katton.engine.StartupAgentInjectionTest'
    }
    systemProperty 'katton.probe.expectAgent', 'true'
    doFirst {
        def agentJar = tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'katton.probe.agentJar', agentJar
        jvmArgs "-javaagent:${agentJar}"
    }
}

tasks.register('verifyKattonDynamicAttachInjection', Test) {
    group = 'verification'
    description = 'Exercise Katton method injection through Byte Buddy dynamic Attach.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'top.katton.engine.DynamicAttachInjectionTest'
    }
    systemProperty 'katton.probe.expectDynamicAttach', 'true'
}


java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
    options.addBooleanOption('quiet', true)
}

def mavenJar = tasks.register('mavenJar', Jar) {
    group = 'build'
    description = 'Assembles the plain library jar used for Maven publication.'
    archiveBaseName = platformName
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('maven-libs').get().asFile
    from(sourceSets.main.output)
}

def mavenSourcesJar = tasks.register('mavenSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the plain sources jar used for Maven publication.'
    archiveBaseName = platformName
    archiveVersion = project.version.toString()
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('maven-libs').get().asFile
    from(sourceSets.main.allSource)
}

publishing {
    publications.withType(MavenPublication).configureEach {
        setArtifacts([
            mavenJar.get(),
            mavenSourcesJar.get(),
            tasks.named('javadocJar').get()
        ])
    }
}
