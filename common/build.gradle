apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'maven-publish'
apply plugin: 'net.fabricmc.fabric-loom'

group = project.maven_group
version = project.mod_version

def targetMinecraftVersion = stonecutter.current.version
def platformName = project.parent?.name ?: project.name
def manifoldVersion = '2026.1.8'

if (!(targetMinecraftVersion in ['26.1.2', '26.2'])) {
    throw new GradleException("Unsupported Minecraft version for Manifold preprocessing: ${targetMinecraftVersion}")
}

base {
    archivesName = platformName
}

repositories {
    mavenCentral()
}

sourceSets {
    manifold {
        java {
            srcDir 'src/manifold/java'
            exclude 'build.properties'
        }
    }
}

configurations {
    manifoldCompileOnly.extendsFrom compileOnly
    manifoldAnnotationProcessor.extendsFrom annotationProcessor
}

def mainCompileClasspath = sourceSets.main.compileClasspath
sourceSets.manifold.compileClasspath += mainCompileClasspath
// Kotlin consumes the preprocessed class output instead of parsing Java files containing #if.
sourceSets.main.compileClasspath += sourceSets.manifold.output
sourceSets.main.runtimeClasspath += sourceSets.manifold.output

loom {
    accessWidenerPath = project.parent.file("src/main/resources/katton.accesswidener")
}

dependencies {
    manifoldCompileOnly "systems.manifold:manifold-preprocessor:${manifoldVersion}"
    manifoldAnnotationProcessor "systems.manifold:manifold-preprocessor:${manifoldVersion}"

    compileOnly 'org.jetbrains.kotlin:kotlin-compiler-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-daemon-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-reflect'
    compileOnly 'org.jetbrains.kotlin:kotlin-script-runtime'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-common'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-compiler-impl-embeddable'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-jvm'
    compileOnly 'org.jetbrains.kotlin:kotlin-scripting-jvm-host'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.0"
    compileOnly "net.bytebuddy:byte-buddy:1.17.8"
    compileOnly "net.bytebuddy:byte-buddy-agent:1.17.8"
    compileOnly "org.jetbrains:annotations:26.0.2"
    compileOnly "org.ow2.asm:asm:9.9.1"
    compileOnly "org.ow2.asm:asm-commons:9.9.1"

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    
    // Fabric API for common module
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
}


java {
    withJavadocJar()
    withSourcesJar()
}

tasks.named('compileManifoldJava', JavaCompile) {
    options.annotationProcessorPath = configurations.manifoldAnnotationProcessor
    options.compilerArgs += [
        '-Xplugin:Manifold',
        "-AMC_VERSION=${targetMinecraftVersion}"
    ]
    options.fork = true
    options.forkOptions.jvmArgs += '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
}

tasks.named('compileKotlin') {
    dependsOn tasks.named('compileManifoldJava')
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileManifoldJava')
}

tasks.named('classes') {
    dependsOn tasks.named('manifoldClasses')
}

tasks.named('jar') {
    from sourceSets.manifold.output
}

tasks.named('sourcesJar') {
    from sourceSets.manifold.allSource
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
    options.addBooleanOption('quiet', true)
}
