import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.jar.JarFile
import java.util.jar.JarInputStream

plugins {
	id 'maven-publish'
		id "org.jetbrains.kotlin.jvm" version "2.3.10"
		id "org.jetbrains.dokka" version "2.1.0"
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    // Declare Paper build plugins once so Stonecutter version projects share a
    // single plugin classloader. Applying versioned copies in both version
    // projects can mix incompatible kotlinx.serialization internals.
    id 'com.gradleup.shadow' version '8.3.10' apply false
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.23' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
    id 'top.katton.api-doc-generator'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

ext.minecraftMavenVersion = { Object minecraftVersion ->
    def baseVersion = rootProject.findProperty('mod_version').toString()
    def snapshotSuffix = '-SNAPSHOT'
    def isSnapshot = baseVersion.endsWith(snapshotSuffix)
    def releaseVersion = isSnapshot
        ? baseVersion.substring(0, baseVersion.length() - snapshotSuffix.length())
        : baseVersion
    "${releaseVersion}+mc${minecraftVersion}${isSnapshot ? snapshotSuffix : ''}"
}

def stonecutterControllerPaths = [':common', ':fabric', ':neoforge', ':paper'] as Set
def isStonecutterControllerProject = { Project candidate ->
    stonecutterControllerPaths.contains(candidate.path)
}
def isStonecutterVersionProject = { Project candidate ->
    stonecutterControllerPaths.contains(candidate.parent?.path)
}
def isStonecutterManagedProject = { Project candidate ->
    isStonecutterControllerProject(candidate) || isStonecutterVersionProject(candidate)
}
def activeStonecutterVersionProvider = providers
    .fileContents(layout.projectDirectory.file('stonecutter.active'))
    .asText
    .map { it.trim() }
    .orElse('26.2')

def isSnapshotVersion = provider { project.version.toString().endsWith('-SNAPSHOT') }
def nexusBaseUrl = providers.gradleProperty('nexusBaseUrl').orElse('https://nexus.mcfpp.top')
def nexusReleasesRepository = providers.gradleProperty('nexusReleasesRepository').orElse('maven-releases')
def nexusSnapshotsRepository = providers.gradleProperty('nexusSnapshotsRepository').orElse('maven-snapshots')
def nexusUsernameProvider = providers.gradleProperty('nexusUsername')
    .orElse(providers.environmentVariable('NEXUS_USERNAME'))
def nexusPasswordProvider = providers.gradleProperty('nexusPassword')
    .orElse(providers.environmentVariable('NEXUS_PASSWORD'))
// Keep secrets out of the repository: provide nexusUsername/nexusPassword in ~/.gradle/gradle.properties
// or via ORG_GRADLE_PROJECT_nexusUsername / ORG_GRADLE_PROJECT_nexusPassword.
def nexusRepositoryUrl = provider {
    def repositoryName = isSnapshotVersion.get() ? nexusSnapshotsRepository.get() : nexusReleasesRepository.get()
    "${nexusBaseUrl.get().replaceAll('/+$', '')}/repository/${repositoryName}/"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
}

// The root project has no loader or mod runtime. Launch the active Fabric
// version instead of Loom's root development launcher.
['runClient', 'runServer'].each { runTaskName ->
    tasks.named(runTaskName) {
        enabled = false
        setDependsOn([":fabric:${activeStonecutterVersionProvider.get()}:${runTaskName}"])
        description = "Launch the active Stonecutter Fabric target via ${runTaskName}."
    }
}

// Root build will configure Architectury Loom for subprojects that apply it
subprojects {
    if (!isStonecutterManagedProject(project)) {
        apply plugin: 'org.jetbrains.kotlin.jvm'
    }

    if (!isStonecutterManagedProject(project)) {
        apply plugin: 'maven-publish'
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.locale = 'en_US'
        options.jFlags('-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8')
    }

    if (isStonecutterVersionProject(project)) {
        // These publications replace component artifacts, so Maven POM metadata is canonical.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                mavenLocal()
                maven {
                    name = 'privateNexus'
                    url = uri(nexusRepositoryUrl.get())
                    allowInsecureProtocol = false
                    credentials {
                        username = nexusUsernameProvider.orNull
                        password = nexusPasswordProvider.orNull
                    }
                    authentication {
                        basic(BasicAuthentication)
                    }
                }
            }
        }

        afterEvaluate {
            // java-gradle-plugin owns its implementation and marker
            // publications. Creating a second publication from the same Java
            // component removes artifacts from Gradle's generated plugin metadata.
            if (!project.plugins.hasPlugin('java-gradle-plugin')) {
                def publication = publishing.publications.findByName('mavenJava')
                if (publication == null) {
                    publication = publishing.publications.create('mavenJava', MavenPublication)
                }

                def publicationComponent = project.findProperty('useLeanMavenPublication') ? null : components.findByName('java')
                if (publicationComponent != null && publication.artifacts.empty) {
                    publication.from publicationComponent
                }

                def moduleName = stonecutterControllerPaths.contains(project.parent?.path) ? project.parent.name : project.name
                publication.artifactId = "${rootProject.findProperty('archives_base_name')}-${moduleName}"
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.locale = 'en_US'
    options.jFlags('-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8')
}

tasks.withType(KotlinCompile).all {
    kotlinOptions {
        jvmTarget = 25
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

