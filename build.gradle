 import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.3.10"
	id "org.jetbrains.dokka" version "2.1.0"
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'top.katton.api-doc-generator'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

ext.minecraftMavenVersion = { Object minecraftVersion ->
    def baseVersion = rootProject.findProperty('mod_version').toString()
    def snapshotSuffix = '-SNAPSHOT'
    def isSnapshot = baseVersion.endsWith(snapshotSuffix)
    def releaseVersion = isSnapshot
        ? baseVersion.substring(0, baseVersion.length() - snapshotSuffix.length())
        : baseVersion
    "${releaseVersion}+mc${minecraftVersion}${isSnapshot ? snapshotSuffix : ''}"
}

def stonecutterControllerPaths = [':common', ':fabric', ':neoforge', ':paper'] as Set
def isStonecutterControllerProject = { Project candidate ->
    stonecutterControllerPaths.contains(candidate.path)
}
def isStonecutterVersionProject = { Project candidate ->
    stonecutterControllerPaths.contains(candidate.parent?.path)
}
def isStonecutterManagedProject = { Project candidate ->
    isStonecutterControllerProject(candidate) || isStonecutterVersionProject(candidate)
}
def activeStonecutterVersionProvider = providers
    .fileContents(layout.projectDirectory.file('stonecutter.active'))
    .asText
    .map { it.trim() }
    .orElse('26.2')

def isSnapshotVersion = provider { project.version.toString().endsWith('-SNAPSHOT') }
def nexusBaseUrl = providers.gradleProperty('nexusBaseUrl').orElse('https://nexus.mcfpp.top')
def nexusReleasesRepository = providers.gradleProperty('nexusReleasesRepository').orElse('maven-releases')
def nexusSnapshotsRepository = providers.gradleProperty('nexusSnapshotsRepository').orElse('maven-snapshots')
def nexusUsernameProvider = providers.gradleProperty('nexusUsername')
    .orElse(providers.environmentVariable('NEXUS_USERNAME'))
def nexusPasswordProvider = providers.gradleProperty('nexusPassword')
    .orElse(providers.environmentVariable('NEXUS_PASSWORD'))
// Keep secrets out of the repository: provide nexusUsername/nexusPassword in ~/.gradle/gradle.properties
// or via ORG_GRADLE_PROJECT_nexusUsername / ORG_GRADLE_PROJECT_nexusPassword.
def nexusRepositoryUrl = provider {
    def repositoryName = isSnapshotVersion.get() ? nexusSnapshotsRepository.get() : nexusReleasesRepository.get()
    "${nexusBaseUrl.get().replaceAll('/+$', '')}/repository/${repositoryName}/"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
}

// Root build will configure Architectury Loom for subprojects that apply it
subprojects {
    if (!isStonecutterManagedProject(project)) {
        apply plugin: 'org.jetbrains.kotlin.jvm'
    }

    if (!isStonecutterManagedProject(project)) {
        apply plugin: 'maven-publish'
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.locale = 'en_US'
        options.jFlags('-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8')
    }

    if (isStonecutterVersionProject(project)) {
        // These publications replace component artifacts, so Maven POM metadata is canonical.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                mavenLocal()
                maven {
                    name = 'privateNexus'
                    url = uri(nexusRepositoryUrl.get())
                    allowInsecureProtocol = false
                    credentials {
                        username = nexusUsernameProvider.orNull
                        password = nexusPasswordProvider.orNull
                    }
                }
            }
        }

        afterEvaluate {
            def publication = publishing.publications.findByName('mavenJava')
            if (publication == null) {
                publication = publishing.publications.create('mavenJava', MavenPublication)
            }

            def publicationComponent = project.findProperty('useLeanMavenPublication') ? null : components.findByName('java')
            if (publicationComponent != null && publication.artifacts.empty) {
                publication.from publicationComponent
            }

            def moduleName = stonecutterControllerPaths.contains(project.parent?.path) ? project.parent.name : project.name
            publication.artifactId = "${rootProject.findProperty('archives_base_name')}-${moduleName}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.locale = 'en_US'
    options.jFlags('-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8')
}

tasks.withType(KotlinCompile).all {
    kotlinOptions {
        jvmTarget = 25
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

kattonApiDocs {
    outputDir = layout.buildDirectory.dir('docs')
    locales = ['en', 'zh']
    defaultLocale = 'en'

    module('common') {
        displayName = 'Common'
        sourceRoots.from(project(':common').file('src/main/kotlin/top/katton/api'))
    }

    module('fabric') {
        displayName = 'Fabric'
        sourceRoots.from(project(':fabric').file('src/main/kotlin/top/katton/api'))
    }

    module('neoforge') {
        displayName = 'NeoForge'
        sourceRoots.from(project(':neoforge').file('src/main/kotlin/top/katton/api'))
    }

    module('paper') {
        displayName = 'Paper'
        sourceRoots.from(project(':paper').file('src/main/kotlin/top/katton/api'))
    }
}


// Fabric/Architectury/Loom 配置已移动到 fabric/build.gradle 中，fabric 模块自行应用和配置 loom 插件。
// 这样避免在根项目配置阶段尝试加载 loom 插件导致的解析问题。
// neoforge and common are regular JVM modules
project(':common') {
    // common 不应用 loom，作为纯 JVM 库编译，运行时由子模块提供 Minecraft
}

project(':neoforge') {
    // NeoForge 模块保留为普通 JVM 模块，运行时依赖 NeoForge
}

// existing tasks kept for root project
def datapackName = 'qwq'
def worldName = 'test'
def datapacksDir = layout.projectDirectory.dir("Katton-Example/${datapackName}")
def targetDatapacksDir = layout.projectDirectory.dir("run/saves/${worldName}/datapacks/${datapackName}")


sourceSets {
	test {
		java.srcDirs += ["Katton-Example/${datapackName}"]
		kotlin.srcDirs += ["Katton-Example/${datapackName}"]
	}
}


// 任务：将 Katton-Example/${datapackName} 复制并合并到 run/saves/${worldName}/datapacks/${datapackName}
// Katton-Example/${datapackName} 优先级更高，会覆盖目标目录中的同名文件
tasks.register('copyDatapacks', Copy) {
    group = 'Katton'
    description = "Copy and merge datapacks from Katton-Example/${datapackName} to run/saves/${worldName}/datapacks/${datapackName}"

    from datapacksDir
    into targetDatapacksDir

    // 如果文件冲突，使用 Katton-Example/${datapackName} 的文件（覆盖目标文件）
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // 显示复制的文件
    eachFile { details ->
        logger.lifecycle("Copying datapack: ${details.sourcePath}")
    }
}

// 任务：清理并强制重新复制所有 datapacks
tasks.register('cleanDatapacks') {
    group = 'Katton'
    description = 'Clean target datapacks directory'

    doFirst {
        // 删除目标目录
        def targetDir = targetDatapacksDir.asFile
        if (targetDir.exists()) {
            logger.lifecycle("Cleaning target directory: ${targetDir.absolutePath}")
            delete targetDir
        }
    }
}

tasks.register('buildKattonJars') {
    group = 'build'
    description = 'Build Fabric, NeoForge, and Paper deployment jars for the active Stonecutter target.'
    def activeTarget = activeStonecutterVersionProvider.get()
    dependsOn ":fabric:${activeTarget}:jar", ":neoforge:${activeTarget}:jar", ":paper:${activeTarget}:shadowJar"
}

def nexusVersionedModules = ['common', 'fabric', 'neoforge', 'paper']
def activeNexusPublishTasks = nexusVersionedModules.collect {
    ":${it}:${activeStonecutterVersionProvider.get()}:publishAllPublicationsToPrivateNexusRepository"
}
def allNexusPublishTasks = nexusVersionedModules.collectMany { moduleName ->
    project(":${moduleName}").subprojects.collect { versionProject ->
        "${versionProject.path}:publishAllPublicationsToPrivateNexusRepository"
    }
}.sort()

def validateNexusCredentials = tasks.register('validateNexusCredentials') {
    group = 'publishing'
    description = 'Validate credentials required by the private Nexus repository.'
    doLast {
        if (!nexusUsernameProvider.isPresent() || nexusUsernameProvider.get().trim().isEmpty()) {
            throw new GradleException('Missing Nexus username. Set nexusUsername or NEXUS_USERNAME.')
        }
        if (!nexusPasswordProvider.isPresent() || nexusPasswordProvider.get().isEmpty()) {
            throw new GradleException('Missing Nexus password. Set nexusPassword or NEXUS_PASSWORD.')
        }
    }
}

allprojects {
    tasks.matching { it.name.endsWith('ToPrivateNexusRepository') }.configureEach {
        dependsOn validateNexusCredentials
    }
}

tasks.register('publishActiveVersionToPrivateNexus') {
    group = 'publishing'
    description = "Publish all Minecraft modules for the active Stonecutter version to ${nexusRepositoryUrl.get()}."
    dependsOn activeNexusPublishTasks
}

def publishAllVersionsToPrivateNexus = tasks.register('publishAllVersionsToPrivateNexus') {
    group = 'publishing'
    description = "Publish every Minecraft module and Stonecutter version to ${nexusRepositoryUrl.get()}."
    dependsOn allNexusPublishTasks
}

def publishSignPluginToPrivateNexus = tasks.register('publishSignPluginToPrivateNexus') {
    group = 'publishing'
    description = "Publish the version-independent Katton signing Gradle plugin to ${nexusRepositoryUrl.get()}."
    dependsOn ':sign-plugin:publishAllPublicationsToPrivateNexusRepository'
}

tasks.register('publishEverythingToPrivateNexus') {
    group = 'publishing'
    description = 'Publish all Minecraft versions and the Katton signing Gradle plugin.'
    dependsOn publishAllVersionsToPrivateNexus, publishSignPluginToPrivateNexus
}

tasks.register('publishAllToPrivateNexus') {
    group = 'publishing'
    description = 'Alias for publishAllVersionsToPrivateNexus.'
    dependsOn publishAllVersionsToPrivateNexus
}
