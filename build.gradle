// 任务：将 Katton-Example/${datapackName} 复制并合并到 run/saves/${worldName}/datapacks/${datapackName}
// Katton-Example/${datapackName} 优先级更高，会覆盖目标目录中的同名文件
tasks.register('copyDatapacks', Copy) {
    group = 'Katton'
    description = "Copy and merge datapacks from Katton-Example/${datapackName} to run/saves/${worldName}/datapacks/${datapackName}"

    from datapacksDir
    into targetDatapacksDir

    // 如果文件冲突，使用 Katton-Example/${datapackName} 的文件（覆盖目标文件）
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // 显示复制的文件
    eachFile { details ->
        logger.lifecycle("Copying datapack: ${details.sourcePath}")
    }
}

// 任务：清理并强制重新复制所有 datapacks
tasks.register('cleanDatapacks') {
    group = 'Katton'
    description = 'Clean target datapacks directory'

    doFirst {
        // 删除目标目录
        def targetDir = targetDatapacksDir.asFile
        if (targetDir.exists()) {
            logger.lifecycle("Cleaning target directory: ${targetDir.absolutePath}")
            delete targetDir
        }
    }
}

tasks.register('buildKattonJars') {
    group = 'build'
    description = 'Build Fabric, NeoForge, and Paper deployment jars for the active Stonecutter target.'
    def activeTarget = activeStonecutterVersionProvider.get()
    dependsOn ":fabric:${activeTarget}:jar", ":neoforge:${activeTarget}:jar", ":paper:${activeTarget}:shadowJar"
}

def releaseMinecraftVersions = ['26.1.2', '26.2']
def releasePlatforms = ['fabric', 'neoforge', 'paper']
def releaseArtifactFile = { String platform, String minecraftVersion ->
    def artifactVersion = rootProject.ext.minecraftMavenVersion(minecraftVersion)
    rootProject.layout.buildDirectory.file("${platform}-katton-${artifactVersion}.jar").get().asFile
}
def releaseArtifactTasks = releaseMinecraftVersions.collectMany { minecraftVersion ->
    [
        ":fabric:${minecraftVersion}:jar",
        ":neoforge:${minecraftVersion}:jar",
        ":paper:${minecraftVersion}:shadowJar"
    ]
}

tasks.register('buildReleaseArtifacts') {
    group = 'build'
    description = 'Build all six Fabric, NeoForge, and Paper deployment jars for supported Minecraft versions.'
    dependsOn releaseArtifactTasks
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Verify platform descriptors, versions, entrypoints, and agent metadata in all release jars.'
    dependsOn tasks.named('buildReleaseArtifacts')

    doLast {
        def requiredAgentAttributes = [
            'Premain-Class': 'top.katton.engine.KattonAgent',
            'Agent-Class': 'top.katton.engine.KattonAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        ]
        def descriptorPaths = [
            fabric: 'fabric.mod.json',
            neoforge: 'META-INF/neoforge.mods.toml',
            paper: 'paper-plugin.yml'
        ]

        releaseMinecraftVersions.each { minecraftVersion ->
            def expectedArtifactVersion = rootProject.ext.minecraftMavenVersion(minecraftVersion)
            def neoTargetProject = project(":neoforge:${minecraftVersion}")
            def expectedNeoVersionRange = "[${neoTargetProject.property('neo_version')},)"
            def expectedMinecraftVersionRange = neoTargetProject.property('minecraft_version_range').toString()

            releasePlatforms.each { platform ->
                def artifact = releaseArtifactFile(platform, minecraftVersion)
                if (!artifact.isFile() || artifact.length() == 0L) {
                    throw new GradleException("Missing or empty release artifact: ${artifact}")
                }

                new JarFile(artifact).withCloseable { jar ->
                    def expectedDescriptor = descriptorPaths[platform]
                    if (jar.getJarEntry(expectedDescriptor) == null) {
                        throw new GradleException("${artifact.name} is missing ${expectedDescriptor}")
                    }

                    descriptorPaths.findAll { otherPlatform, ignored -> otherPlatform != platform }
                        .each { otherPlatform, descriptorPath ->
                            if (jar.getJarEntry(descriptorPath) != null) {
                                throw new GradleException(
                                    "${artifact.name} unexpectedly contains the ${otherPlatform} descriptor ${descriptorPath}"
                                )
                            }
                        }

                    def descriptorText = jar.getInputStream(jar.getJarEntry(expectedDescriptor)).withCloseable {
                        new String(it.readAllBytes(), StandardCharsets.UTF_8)
                    }

                    if (platform == 'fabric') {
                        def metadata = new JsonSlurper().parseText(descriptorText)
                        if (metadata.id != 'katton') {
                            throw new GradleException("${artifact.name} has Fabric mod id '${metadata.id}', expected 'katton'")
                        }
                        if (metadata.version != expectedArtifactVersion) {
                            throw new GradleException(
                                "${artifact.name} declares Fabric version '${metadata.version}', expected '${expectedArtifactVersion}'"
                            )
                        }
                        if (metadata.entrypoints?.main?.first()?.value != 'top.katton.KattonFabric') {
                            throw new GradleException("${artifact.name} has an invalid Fabric main entrypoint")
                        }
                    } else if (platform == 'neoforge') {
                        if (!descriptorText.contains('modId="katton"')) {
                            throw new GradleException("${artifact.name} does not declare the Katton NeoForge mod id")
                        }
                        if (!descriptorText.contains("version=\"${expectedArtifactVersion}\"")) {
                            throw new GradleException(
                                "${artifact.name} does not declare NeoForge version '${expectedArtifactVersion}'"
                            )
                        }
                        if (!descriptorText.contains('modId="neoforge"') ||
                            !descriptorText.contains("versionRange=\"${expectedNeoVersionRange}\"")) {
                            throw new GradleException("${artifact.name} does not declare its required NeoForge version")
                        }
                        if (!descriptorText.contains('modId="minecraft"') ||
                            !descriptorText.contains("versionRange=\"${expectedMinecraftVersionRange}\"")) {
                            throw new GradleException("${artifact.name} does not declare its supported Minecraft range")
                        }

                        def compilerEntry = jar.entries().find {
                            it.name.startsWith('META-INF/jarjar/') &&
                                it.name.endsWith('kotlin-compiler-embeddable-2.3.10-katton.jar')
                        }
                        if (compilerEntry == null) {
                            throw new GradleException("${artifact.name} is missing the sanitized Kotlin compiler Jar-in-Jar")
                        }

                        def hasCompilerEntrypoint = false
                        def unavailableJlineProvider = null
                        jar.getInputStream(compilerEntry).withCloseable { compilerStream ->
                            new JarInputStream(compilerStream).withCloseable { nestedJar ->
                                def moduleName = nestedJar.manifest?.mainAttributes?.getValue('Automatic-Module-Name')
                                if (moduleName != 'org.jetbrains.kotlin.compiler.embeddable.katton') {
                                    throw new GradleException(
                                        "${artifact.name} embeds a Kotlin compiler jar without the expected module name"
                                    )
                                }

                                def nestedEntry
                                while ((nestedEntry = nestedJar.nextJarEntry) != null) {
                                    if (nestedEntry.name == 'org/jetbrains/kotlin/cli/jvm/K2JVMCompiler.class') {
                                        hasCompilerEntrypoint = true
                                    }
                                    if (!nestedEntry.directory && nestedEntry.name.startsWith(
                                        'META-INF/services/org/jline/terminal/provider/'
                                    )) {
                                        unavailableJlineProvider = nestedEntry.name
                                    }
                                }
                            }
                        }
                        if (!hasCompilerEntrypoint) {
                            throw new GradleException("${artifact.name} embeds a Kotlin compiler jar without K2JVMCompiler")
                        }
                        if (unavailableJlineProvider != null) {
                            throw new GradleException(
                                "${artifact.name} embeds unavailable JLine provider ${unavailableJlineProvider}"
                            )
                        }
                    } else {
                        if (!descriptorText.contains('main: top.katton.paper.KattonPaperPlugin')) {
                            throw new GradleException("${artifact.name} has an invalid Paper main entrypoint")
                        }
                        if (!descriptorText.contains("version: '${expectedArtifactVersion}'")) {
                            throw new GradleException(
                                "${artifact.name} does not declare Paper version '${expectedArtifactVersion}'"
                            )
                        }
                    }

                    // Audio decoding needs its embedded libraries on the mod platforms, and every
                    // deployment must carry the license notices for whatever it ships.
                    ['META-INF/licenses/LGPL-2.1.txt', 'META-INF/licenses/katton-audio-NOTICE.txt'].each { entryName ->
                        if (jar.getJarEntry(entryName) == null) {
                            throw new GradleException("${artifact.name} is missing ${entryName}")
                        }
                    }
                    def audioLibraries = ['jlayer-1.0.1.jar', 'jflac-codec-1.5.2.jar']
                    if (platform == 'paper') {
                        if (jar.getJarEntry('javazoom/jl/decoder/Bitstream.class') != null) {
                            throw new GradleException("${artifact.name} unexpectedly bundles the JLayer audio decoder")
                        }
                    } else {
                        audioLibraries.each { library ->
                            def nested = jar.entries().find {
                                it.name.endsWith('.jar') && it.name.contains(library) && it.size > 0L
                            }
                            if (nested == null) {
                                throw new GradleException("${artifact.name} is missing the embedded audio library ${library}")
                            }
                        }
                        if (platform == 'fabric') {
                            audioLibraries.each { library ->
                                if (!new JsonSlurper().parseText(descriptorText).jars?.any { it.file?.endsWith(library) }) {
                                    throw new GradleException("${artifact.name} does not declare ${library} in fabric.mod.json jars")
                                }
                            }
                        }
                    }

                    if (platform != 'paper') {
                        requiredAgentAttributes.each { attributeName, expectedValue ->
                            def actualValue = jar.manifest?.mainAttributes?.getValue(attributeName)
                            if (actualValue != expectedValue) {
                                throw new GradleException(
                                    "${artifact.name} manifest ${attributeName}='${actualValue}', expected '${expectedValue}'"
                                )
                            }
                        }
                    }
                }

                logger.lifecycle("Verified release artifact: ${artifact.name}")
            }
        }
    }
}

def releaseAgentVerificationTasks = releaseMinecraftVersions.collectMany { minecraftVersion ->
    ['fabric', 'neoforge'].collect { platform ->
        def commonTarget = project(":common:${minecraftVersion}")
        commonTarget.tasks.register("verify${platform.capitalize()}ReleaseAgent", Test) {
            group = 'verification'
            description = "Verify the ${platform} ${minecraftVersion} deployment jar performs startup-agent injection."

            dependsOn rootProject.tasks.named('verifyReleaseArtifacts')
            dependsOn commonTarget.tasks.named('testClasses')
            testClassesDirs = commonTarget.sourceSets.test.output.classesDirs
            classpath = commonTarget.sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            filter {
                includeTestsMatching 'top.katton.engine.StartupAgentInjectionTest'
            }
            def agentJar = releaseArtifactFile(platform, minecraftVersion)
            inputs.file(agentJar).withPropertyName('agentJar')
            systemProperty 'katton.probe.expectAgent', 'true'
            systemProperty 'katton.probe.agentJar', agentJar.absolutePath
            jvmArgs "-javaagent:${agentJar.absolutePath}"
        }
    }
}.flatten()

tasks.register('verifyReleaseAgentArtifacts') {
    group = 'verification'
    description = 'Exercise startup-agent injection through all four Fabric and NeoForge deployment jars.'
    dependsOn releaseAgentVerificationTasks
}

tasks.register('prepareReleaseArtifacts') {
    group = 'distribution'
    description = 'Verify and stage the six deployment jars with a SHA-256 checksum file.'
    dependsOn tasks.named('verifyReleaseAgentArtifacts')

    doLast {
        def releaseDirectory = rootProject.layout.buildDirectory
            .dir("release/${rootProject.mod_version}")
            .get()
            .asFile
        Files.createDirectories(releaseDirectory.toPath())

        def checksumLines = []
        releaseMinecraftVersions.each { minecraftVersion ->
            releasePlatforms.each { platform ->
                def artifact = releaseArtifactFile(platform, minecraftVersion)
                def stagedArtifact = releaseDirectory.toPath().resolve(artifact.name)
                Files.copy(artifact.toPath(), stagedArtifact, StandardCopyOption.REPLACE_EXISTING)

                def digest = MessageDigest.getInstance('SHA-256')
                artifact.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                    }
                }
                def checksum = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
                checksumLines << "${checksum}  ${artifact.name}"
            }
        }

        def checksumFile = releaseDirectory.toPath().resolve('SHA256SUMS')
        Files.writeString(
            checksumFile,
            checksumLines.join(System.lineSeparator()) + System.lineSeparator(),
            StandardCharsets.UTF_8
        )
        logger.lifecycle("Prepared release artifacts in ${releaseDirectory}")
    }
}

def nexusVersionedModules = ['common', 'fabric', 'neoforge', 'paper']
def activeNexusPublishTasks = nexusVersionedModules.collect {
    ":${it}:${activeStonecutterVersionProvider.get()}:publishAllPublicationsToPrivateNexusRepository"
}
def allNexusPublishTasks = nexusVersionedModules.collectMany { moduleName ->
    project(":${moduleName}").subprojects.collect { versionProject ->
        "${versionProject.path}:publishAllPublicationsToPrivateNexusRepository"
    }
}.sort()
def allMavenLocalPublishTasks = nexusVersionedModules.collectMany { moduleName ->
    project(":${moduleName}").subprojects.collect { versionProject ->
        "${versionProject.path}:publishToMavenLocal"
    }
}.sort()

tasks.register('verifyLocalMavenPublications') {
    group = 'verification'
    description = 'Publish every Minecraft release module to Maven Local to validate POM and module metadata.'
    dependsOn allMavenLocalPublishTasks
}

def validateNexusCredentials = tasks.register('validateNexusCredentials') {
    group = 'publishing'
    description = 'Validate credentials required by the private Nexus repository.'
    doLast {
        if (!nexusUsernameProvider.isPresent() || nexusUsernameProvider.get().trim().isEmpty()) {
            throw new GradleException('Missing Nexus username. Set nexusUsername or NEXUS_USERNAME.')
        }
        if (!nexusPasswordProvider.isPresent() || nexusPasswordProvider.get().isEmpty()) {
            throw new GradleException('Missing Nexus password. Set nexusPassword or NEXUS_PASSWORD.')
        }
    }
}

allprojects {
    tasks.matching { it.name.endsWith('ToPrivateNexusRepository') }.configureEach {
        dependsOn validateNexusCredentials
    }
}

tasks.register('publishActiveVersionToPrivateNexus') {
    group = 'publishing'
    description = "Publish all Minecraft modules for the active Stonecutter version to ${nexusRepositoryUrl.get()}."
    dependsOn activeNexusPublishTasks
}

def publishAllVersionsToPrivateNexus = tasks.register('publishAllVersionsToPrivateNexus') {
    group = 'publishing'
    description = "Publish every Minecraft module and Stonecutter version to ${nexusRepositoryUrl.get()}."
    dependsOn allNexusPublishTasks
}

tasks.register('publishEverythingToPrivateNexus') {
    group = 'publishing'
    description = 'Publish all Minecraft versions. The signing plugin is published from Katton-Sign.'
    dependsOn publishAllVersionsToPrivateNexus
}

tasks.register('publishAllToPrivateNexus') {
    group = 'publishing'
    description = 'Alias for publishAllVersionsToPrivateNexus.'
    dependsOn publishAllVersionsToPrivateNexus
}
